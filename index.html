<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: linear-gradient(180deg, #eef2ee, #f7f4ef);
  color: #4f6f52;
}

/* layout */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 250px 1fr;
  gap: 20px;
}

/* side panel */
.side {
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* main card */
.card {
  background: #ffffff;
  border-radius: 30px;
  padding: 25px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

/* cozy window effect */
.card::before {
  content: "";
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  height: 120px;
  background: radial-gradient(circle at center, #e8f0ea, transparent);
  border-radius: 20px;
  opacity: 0.6;
}

/* title */
h1 {
  text-align: center;
  letter-spacing: 3px;
  font-size: 28px;
  margin-bottom: 10px;
}

/* subtitle */
.subtitle {
  text-align: center;
  font-size: 14px;
  opacity: 0.7;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 14px;
  margin-top: 20px;
}

/* circles */
.day {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid #7aa87a;
  background: #fdfdfc;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
}

/* hover softness */
.day:hover {
  transform: scale(1.08);
  box-shadow: 0 4px 12px rgba(122,168,122,0.2);
}

/* checked state */
.day.checked {
  background: #7aa87a;
  transform: scale(1.12);
  box-shadow: 0 0 20px rgba(122,168,122,0.5);
}

/* glow */
.day.checked::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(122,168,122,0.3), transparent);
  animation: glow 0.6s ease;
}

@keyframes glow {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* sparkle particles */
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #dfe9df;
  border-radius: 50%;
  animation: float 6s infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity:0; }
  50% { opacity:1; }
  100% { transform: translateY(-80px); opacity:0; }
}

/* notes */
.notes {
  grid-column: span 2;
  background: rgba(255,255,255,0.7);
  border-radius: 20px;
  padding: 20px;
  margin-top: 15px;
}

/* text areas */
textarea {
  width: 100%;
  border-radius: 12px;
  border: none;
  padding: 10px;
  margin-top: 8px;
  background: #f6f9f6;
}

/* soft divider */
.section-title {
  margin-top: 15px;
  font-weight: bold;
}
</style>
